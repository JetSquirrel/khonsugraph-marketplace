name: CI

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - 'marketplace.json'
      - '**.md'

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check the manifests
        run: python3 scripts/marketplace.py check

      # A change to a plugin is released by raising its version, so a change
      # at a version already released would never reach anyone.
      - name: A changed plugin has a new version
        if: github.event_name == 'pull_request'
        run: python3 scripts/marketplace.py guard "origin/${{ github.base_ref }}"

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - run: cargo test --locked --workspace
